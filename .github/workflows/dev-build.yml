name: Dev build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CONURE_BUILD_REF: refs/heads/main
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Build, assemble and verify dev app
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          scripts/make-app.sh 0.1.0-dev dev
          printf 'Source commit: `%s`\n\nSource ref: `%s`\n' "$COMMIT_SHA" "$CONURE_BUILD_REF" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CI_RUN_URL" ]; then
            printf '\nTriggering CI run: %s\n' "$CI_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package ZIP and checksum
        id: package
        run: |
          DATE="$(date -u +%Y%m%d)"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          NAME="Conure-Dev-${DATE}-${SHORT_SHA}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent 'Conure Dev.app' "$NAME.zip"
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"
          shasum -a 256 -c "$NAME.zip.sha256"

      - name: Attest final dev ZIP
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ steps.package.outputs.name }}.zip

      - name: Upload installable dev build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 14
          if-no-files-found: error
