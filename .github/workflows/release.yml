name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamp for the build (e.g. 0.2.0)"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify app + DMG
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CONURE_UPDATE_PUBLIC_KEY: ${{ vars.CONURE_UPDATE_PUBLIC_KEY }}
      CONURE_REQUIRE_UPDATE_KEY: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Apple signing configuration (paid path disabled)
        env:
          CONURE_SIGNING_MODE: ${{ vars.CONURE_SIGNING_MODE }}
          CONURE_SIGNING_IDENTITY: ${{ vars.CONURE_SIGNING_IDENTITY }}
          CONURE_APPLE_TEAM_ID: ${{ vars.CONURE_APPLE_TEAM_ID }}
          CONURE_DEVELOPER_ID_P12_BASE64: ${{ secrets.CONURE_DEVELOPER_ID_P12_BASE64 }}
          CONURE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CONURE_DEVELOPER_ID_P12_PASSWORD }}
          CONURE_NOTARY_KEY_ID: ${{ vars.CONURE_NOTARY_KEY_ID }}
          CONURE_NOTARY_ISSUER_ID: ${{ vars.CONURE_NOTARY_ISSUER_ID }}
          CONURE_NOTARY_PRIVATE_KEY: ${{ secrets.CONURE_NOTARY_PRIVATE_KEY }}
        run: scripts/check-apple-signing.sh

      - name: Resolve version and source
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag must match vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          if [ "$CONURE_REQUIRE_UPDATE_KEY" = true ]; then
            test -n "$CONURE_UPDATE_PUBLIC_KEY" || { echo 'Configure CONURE_UPDATE_PUBLIC_KEY before releasing' >&2; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject version into CLI
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sed -i '' -E "s/current = \".*\"/current = \"$VERSION\"/" Sources/conure/ConureVersion.swift
          grep 'current =' Sources/conure/ConureVersion.swift

      - name: Build, assemble and verify app + DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          scripts/make-app.sh "$VERSION"
          scripts/make-dmg.sh "$VERSION"
          test "$(dist/Conure.app/Contents/Helpers/conure --version)" = "$VERSION"

      - name: Prepare release summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          printf 'Conure %s\nSource commit: %s\nBuild: %s/%s/actions/runs/%s\n\nChanges:\n' \
            "$VERSION" "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/release-notes.txt
          BASE=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            git log "$BASE..HEAD" --format='- %s' >> dist/release-notes.txt
          else
            git log -20 --format='- %s' >> dist/release-notes.txt
          fi
          printf '\nVerify downloads: https://github.com/%s/blob/%s/README.md#verify-a-download\n' \
            "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" >> dist/release-notes.txt

      - name: Generate and verify signed stable update feed
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/make-update.sh "$VERSION" dist/release-notes.txt

      - name: Checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "Conure-$VERSION.dmg" > "Conure-$VERSION.dmg.sha256"
          shasum -a 256 -c "Conure-$VERSION.dmg.sha256"

      - name: Attest final DMG
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Conure-${{ steps.ver.outputs.version }}.dmg

      - name: Upload verified DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Conure-${{ steps.ver.outputs.version }}
          path: |
            dist/Conure-${{ steps.ver.outputs.version }}.dmg
            dist/Conure-${{ steps.ver.outputs.version }}.dmg.sha256
            dist/appcast.xml
            dist/release-notes.txt
          if-no-files-found: error

  publish:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Conure-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c "Conure-$VERSION.dmg.sha256"
          EXTRA=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA+=(--prerelease)
          else
            test -s appcast.xml
            EXTRA+=(appcast.xml)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.txt \
            --title "Conure v$VERSION" \
            "Conure-$VERSION.dmg" \
            "Conure-$VERSION.dmg.sha256" \
            "${EXTRA[@]}"
