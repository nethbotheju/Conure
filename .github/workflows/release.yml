name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamp for the build (e.g. 0.2.0)"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify app + DMG
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version and source
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag must match vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject version into CLI
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sed -i '' -E "s/current = \".*\"/current = \"$VERSION\"/" Sources/conure/ConureVersion.swift
          grep 'current =' Sources/conure/ConureVersion.swift

      - name: Build, assemble and verify app + DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          scripts/make-app.sh "$VERSION"
          scripts/make-dmg.sh "$VERSION"
          test "$(dist/Conure.app/Contents/Helpers/conure --version)" = "$VERSION"

      - name: Checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "Conure-$VERSION.dmg" > "Conure-$VERSION.dmg.sha256"
          shasum -a 256 -c "Conure-$VERSION.dmg.sha256"

      - name: Attest final DMG
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Conure-${{ steps.ver.outputs.version }}.dmg

      - name: Upload verified DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Conure-${{ steps.ver.outputs.version }}
          path: |
            dist/Conure-${{ steps.ver.outputs.version }}.dmg
            dist/Conure-${{ steps.ver.outputs.version }}.dmg.sha256
          if-no-files-found: error

  publish:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Conure-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          cd dist
          sha256sum -c "Conure-$VERSION.dmg.sha256"
          printf 'Tag: `%s`\nSource commit: `%s`\nBuild: %s/%s/actions/runs/%s\n\nVerify checksums and provenance: https://github.com/%s/blob/%s/README.md#verify-a-download\n' \
            "$GITHUB_REF_NAME" "$SOURCE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_REPOSITORY" "$SOURCE_COMMIT" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.md \
            --title "Conure v$VERSION" \
            "Conure-$VERSION.dmg" \
            "Conure-$VERSION.dmg.sha256"
